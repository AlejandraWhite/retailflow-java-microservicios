services:
  localstack:
    image: localstack/localstack:3.8
    container_name: retail-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3,lambda,apigateway
      DEBUG: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  order-service:
    environment:
      AWS_ENDPOINT: http://localstack:4566
    depends_on:
      localstack:
        condition: service_started
